<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میری چیٹ اور فائل ایپ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Navigation Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">واصف چیٹ & فائل ٹرانسفر</h1>
            <div id="status" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">PocketBase Connect...</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24 flex flex-col gap-4">

        <!-- Messages Section -->
        <section id="chat-section" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-xl p-4 overflow-y-auto min-h-[350px] max-h-[500px] flex flex-col gap-3">
            <div class="text-center text-xs text-slate-500 my-2">پیغامات کی تاریخ</div>
            
            <div id="messages-list" class="flex flex-col gap-3">
                <!-- Messages will load dynamically here -->
            </div>
        </section>

        <!-- Input & Attachment Controls -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col gap-3">
            <!-- Selected File Preview -->
            <div id="file-preview" class="hidden text-xs bg-slate-700/50 p-2 rounded flex justify-between items-center text-amber-300">
                <span id="file-name">فائل چنی گئی: none</span>
                <button id="clear-file" type="button" class="text-red-400 font-bold hover:text-red-300 px-2">✕</button>
            </div>

            <form id="message-form" class="flex gap-2 items-center">
                <label for="file-input" class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 p-3 rounded-lg flex items-center justify-center transition">
                    📎
                    <input type="file" id="file-input" class="hidden" />
                </label>
                
                <input type="text" id="message-input" placeholder="اپنا پیغام یا وائس نوٹ بھیجیں..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-400 text-white" required>
                
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 font-semibold text-slate-900 px-5 py-3 rounded-lg text-sm transition">
                    بھیجیں
                </button>
            </form>
        </section>

        <!-- API Settings Panel -->
        <section class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-4 flex flex-col gap-3">
            <h3 class="text-sm font-semibold text-slate-300">PocketBase سرور سیٹنگز</h3>
            <div class="flex gap-2">
                <input id="pb-url-input" type="text" placeholder="https://your-pocketbase-url.com" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-200">
                <button id="save-url-btn" type="button" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded font-medium">Save URL</button>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 p-2 grid grid-cols-4 gap-1 text-center text-xs">
        <button data-page="chat" class="nav-btn text-amber-400 font-semibold py-2">Chats</button>
        <button data-page="files" class="nav-btn text-slate-400 py-2">Files</button>
        <button data-page="dashboard" class="nav-btn text-slate-400 py-2">Stats</button>
        <button data-page="api" class="nav-btn text-slate-400 py-2">API</button>
    </nav>

    <!-- PocketBase SDK & Connection Scripts -->
    <script src="https://unpkg.com/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <script>
        // PocketBase Connection Initialization
        const serverUrl = localStorage.getItem('pb_server_url') || "https://your-pocketbase-url.com";
        const pb = new PocketBase(serverUrl);
    </script>
    <script src="app.js"></script>
</body>
</html>
